CalculatedFields:
- DataSetIdentifier: data_transfer_view
  Expression: ifelse({from_location} = {to_location}, 'AZ', 'NON-AZ')
  Name: AZ-Regional-Traffic
- DataSetIdentifier: data_transfer_view
  Expression: parseDecimal({blended_rate})
  Name: blended-rate
- DataSetIdentifier: data_transfer_view
  Expression: '{blended_cost}'
  Name: cost
- DataSetIdentifier: data_transfer_view
  Expression: Sum({unblended_cost})-Sum({blended_cost})
  Name: cost_diff
- DataSetIdentifier: data_transfer_view
  Expression: parseDecimal({public_ondemand_rate})
  Name: public-ondemand-rate
- DataSetIdentifier: data_transfer_view
  Expression: Max(parseDecimal({unblended_rate}))-Max(parseDecimal({blended_rate}))
  Name: rate_diff
- DataSetIdentifier: data_transfer_view
  Expression: parseDecimal({unblended_rate})
  Name: unblended-rate
- DataSetIdentifier: data_transfer_view
  Expression: ifelse(split({usage_type},'-',2) = split({usage_type},'-',1), 'AZ',
    'Non-AZ')
  Name: usagetype
